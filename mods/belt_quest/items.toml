# ---- combat breadth (C3): weapons across the damage classes ----
# The engine's damage classes are open strings; enemies key their
# resistances on them. Slash/pierce/blunt come from Haven's forge;
# fire comes from the Brood Gallery's venom; corrupt flesh resists
# slash, machines resist everything but blunt and fire.

