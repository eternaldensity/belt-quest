# belt-quest items. Base's iron/copper/coal/stone chain is reused as-is;
# this file adds the factory intermediates the RPG side consumes, the
# consumables, and (further down) the modular gear frames and components.

# ---- factory intermediates (belts 10-factory-rpg-integration) ----

[[item]]
id = "copper_wire"
name = "Copper Wire"
texture = "@leather_strip"
material_class = "geologically_finite"
materials = { copper = 600 }

[[item]]
id = "circuit"
name = "Circuit"
texture = "@crystal_prism"
material_class = "transformative_finite"
materials = { iron = 1200, copper = 1800 }

[[item]]
id = "machine_frame"
name = "Machine Frame"
texture = "@iron_shaft"
material_class = "geologically_finite"
materials = { iron = 4800 }

# ---- consumables: the factory feeds the delver ----

[[item]]
id = "quest_herbs"
name = "Medicinal Herbs"
texture = "@cairnbloom_flower"
material_class = "renewable"
materials = { wood = 60 }

[[item]]
id = "health_stim"
name = "Health Stim"
texture = "@hearth_tonic"
material_class = "transformative_finite"
materials = { wood = 120, coal = 300 }
food = { hunger = 4, nutrition = { health = 8 } }

[[item]]
id = "steel_ration_bar"
name = "Ration Bar"
texture = "@bread"
material_class = "renewable"
materials = { wood = 90 }
food = { hunger = 3, nutrition = { health = 6 } }

# ---- modular equipment, frames (belts 02-modular-equipment) ----
# Frames take typed component slots; components slot in and out INTACT and
# their stats ride the worn loadout only while the frame is worn + intact.
# A frame at 0 durability disables instead of breaking.

[[item]]
id = "light_harness"
name = "Light Harness"
texture = "@leather_chestplate"
durability = 80
armor = { slot = "chest", points = 2 }
frame = { slots = [ { type = "plate", max = 1 }, { type = "lining", max = 1 } ] }
materials = { leather = 3600, iron = 1200 }
[[item.stats]]
kind = "carry"
flat = 24

[[item]]
id = "light_melee_frame"
name = "Light Melee Frame"
texture = "@iron_sword"
durability = 120
damage = 6
damage_type = "slash"
frame = { slots = [ { type = "blade", max = 1 }, { type = "grip", max = 1 } ] }
materials = { wood = 600, iron = 2400 }

