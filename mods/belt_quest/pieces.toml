# Two assemblies (capability E7-era piece walks).
#
# HAVEN: the starter settlement, biome-gated like base's elder_haven. The
# workshop piece carries a live Smelter and Assembler — the factory exists
# before the player does; The Spark teaches you to feed it.
#
# BROOD GALLERY: the starter dungeon (capability E10). Never worldgen — a
# run stamps it into the Deep on demand through its Deep Door. Burrow
# markers bring spiders; the den brings the Brood Mother.

