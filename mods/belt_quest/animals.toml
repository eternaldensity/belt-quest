# A machine left from the first wave: hack it with the right tool and it
# powers down intact; destroy it for scrap.
[[animal]]
id = "scrap_hound"
name = "Scrap Hound"
hostile = true
biomes = ["plains"]
health = 60
speed = 4.8
attack = 5
tex = "@cracked_masonry"
sound_pitch = 1.25
aggro_range = 14
ire_min = 25
group = [1, 2]
rarity = 1
behavior = "construct"
hack = {
  tool = "hack",
  drops = [
    { item = "scrap_plate", min = 1, max = 2 },
    { item = "base:screw", min = 1, max = 3 },
  ],
}
resist = [
  { type = "pierce", mult = 0.5 },
  { type = "slash", mult = 0.5 },
  { type = "fire", mult = 1.5 },
]
attacks = [
  { name = "arc_lash", kind = "melee", damage = 5, cooldown = 1.2, damage_type = "fire" },
]
drops = [
  { item = "scrap_plate", min = 1, max = 2 },
  { item = "base:copper_wire", min = 0, max = 2 },
]
[animal.model]
body = { size = [6, 5, 12], at = [0, 3, 0] }
head = { size = [5, 5, 6], at = [0, 4, -8] }
leg = { size = [2, 3, 2], at = [2, 0, 4] }
