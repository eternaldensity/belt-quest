# Haven's voices (belts 07-quests-and-narrative): gruff-but-warm frontier
# pragmatism. Choices run callbacks (script fns) that accept quests and
# hand out gear; conditions gate topics on quest flags.

[[dialogue]]
id = "marek"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "Welcome to Haven, newcomer. We're glad to have another pair of hands around here."
condition = ""
[[dialogue.nodes.choices]]
label = "What needs doing?"
callback = "belt_quest:accept_settling_in"
next = "settling"

[[dialogue.nodes.choices]]
label = "Goodbye"
next = ""

[[dialogue.nodes]]
id = "settling"
text = "Meet the others first. Ava runs the stall, Sal the workshop, Jonas walks the wall. The board outside keeps us honest — read it, then find me again."
condition = ""
[[dialogue.nodes.choices]]
label = "On my way."
next = ""

[[dialogue.nodes]]
id = "herbs_ask"
text = "Sal burns through bandages faster than we grow them. Meadow's west, past the fence line — five handfuls of the blue-flowered herb should do."
condition = "belt_quest:herbs_available"
[[dialogue.nodes.choices]]
label = "I'll gather them."
callback = "belt_quest:accept_first_errand"
next = ""

# ---- Sal: the factory spark ----

[[dialogue]]
id = "sal"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "You're the newcomer Marek took in? Good. This settlement runs on machines nobody maintains. Interested?"
condition = ""
[[dialogue.nodes.choices]]
label = "Teach me."
callback = "belt_quest:accept_the_spark"
next = "spark"

[[dialogue.nodes.choices]]
label = "Later."
next = ""

[[dialogue.nodes]]
id = "spark"
text = "A smelter is four firebrick and a stubborn streak. I've left materials by the workshop door — place it, feed it ore and charcoal, and bring me one iron ingot. Then we talk about real work."
condition = ""
[[dialogue.nodes.choices]]
label = "Consider it done."
next = ""

# ---- Ava: trade and rumor ----

[[dialogue]]
id = "ava"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "Fresh faces are good for business. Ore in, tools out — the stall's open, prices are fair-ish, and no, they don't get fairer."
condition = ""
[[dialogue.nodes.choices]]
label = "Any rumors?"
next = "rumor"

[[dialogue.nodes.choices]]
label = "Goodbye."
next = ""

[[dialogue.nodes]]
id = "rumor"
text = "Wolves got bold since the mines went quiet. Jonas pays for their pelts — and Sal swears the hill hums at night. I sell goods, not explanations."
condition = ""
[[dialogue.nodes.choices]]
label = "Noted."
next = ""

# ---- Jonas: first threat ----

[[dialogue]]
id = "jonas"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "Stay inside the fence after dark, newcomer. Wolves have been testing the wall all week."
condition = ""
[[dialogue.nodes.choices]]
label = "Give me a reason to fight back."
callback = "belt_quest:greet_first_threat"
next = "threat"

[[dialogue.nodes.choices]]
label = "Understood."
next = ""

[[dialogue.nodes]]
id = "threat"
text = "Here — an iron blade, Haven's make. Take three wolves with it and I'll believe you're not another mouth to feed. They hunt the west meadow at dusk."
condition = ""
[[dialogue.nodes.choices]]
label = "Three wolves it is."
callback = "belt_quest:accept_first_threat"
next = ""

[[dialogue]]
id = "custodian"
root = "contact"

[[dialogue.nodes]]
id = "contact"
text = "...query. You are not Shaper. You are small, and wet, and you carry my maker's keys. State intent."
condition = ""
[[dialogue.nodes.choices]]
label = "We come to learn."
callback = "belt_quest:custodian_cooperative"
next = "learn"

[[dialogue.nodes.choices]]
label = "We come to take."
callback = "belt_quest:custodian_hostile"
next = "take"

[[dialogue.nodes]]
id = "learn"
text = "Learn. Acceptable provisional intent. The makers learned, then they became light. My standing order: maintain, wait, teach those who ask. Deliver alien alloy to any depot bound to this facility and I will log your usefulness."
condition = ""
[[dialogue.nodes.choices]]
label = "What do you maintain?"
next = "maintain"

[[dialogue.nodes.choices]]
label = "I'll return with alloy."
next = ""

[[dialogue.nodes]]
id = "maintain"
text = "Everything you breathe on. The caves were ours. The ore veins where we wanted them. The wolves are a rounding error. Maintenance continues."
condition = ""
[[dialogue.nodes.choices]]
label = "Understood."
next = ""

[[dialogue.nodes]]
id = "take"
text = "Noted. The archive remembers every key it has ever cut. Yours will open fewer doors until my assessment improves."
condition = ""
[[dialogue.nodes.choices]]
label = "We'll see."
next = ""

# Sal reacts to the activation.
[[dialogue.nodes]]
id = "signals_done"
text = "The readings came from UNDER everything. I charted a door in the ruins west — it opened for nobody until now. Take this: the hill wants to be read."
condition = "belt_quest:strange_signals_done"
[[dialogue.nodes.choices]]
label = "I'm on it."
callback = "belt_quest:accept_into_the_deep"
next = ""

[[dialogue]]
id = "bryn"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "Emberwatch. Mind the ridge wolves — they've learned the depot means food carts. Depot's by the yard; iron and coal keep us in powder and lamp oil."
condition = ""
[[dialogue.nodes.choices]]
label = "What's the ridge like?"
next = "ridge"

[[dialogue.nodes.choices]]
label = "Goodbye."
next = ""

[[dialogue.nodes]]
id = "ridge"
text = "Iron in every seam and something big denning above the tree line. We pay good standing for ore and coal — Haven's bread wouldn't survive the climb."
condition = ""
[[dialogue.nodes.choices]]
label = "Noted."
next = ""

[[dialogue]]
id = "oda"
root = "welcome"

[[dialogue.nodes]]
id = "welcome"
text = "Oda's post, last roof before the salt flats. Planks and copper keep my yard standing; everything else is conversation."
condition = ""
[[dialogue.nodes.choices]]
label = "Any word from the ruins?"
next = "ruins"

[[dialogue.nodes.choices]]
label = "Goodbye."
next = ""

[[dialogue.nodes]]
id = "ruins"
text = "Caravans say the glass doors glow at night now. I sell maps, not opinions. But if you go — the yard buys planks and copper first."
condition = ""
[[dialogue.nodes.choices]]
label = "Fair enough."
next = ""
