# belt-quest skill tree (capability E5; authored tree in
# belts rpg-plan/06-skill-tree.md). Six visible branches; the hidden
# Temporal branch arrives with the Chronarch arc (Act 3). Where a belts
# mechanic has no E4 stat channel yet, the closest stat stands in and the
# description keeps the authored promise for a future capability pass.
# Tier-N nodes unlock after 3 tier-(N-1) allocations in-branch (engine rule).

