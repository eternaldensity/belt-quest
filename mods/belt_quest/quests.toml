# Haven's first arc (belts 07 + 13): settle in, errand, factory spark,
# first blood. Rewards follow the authored credits/XP where the engine
# has a channel (items, XP via skill sources, KV flags); credit amounts
# land as old_coins until C7's economy lands.

[[quest]]
id = "settling_in"
title = "Settling In"
description = "Meet Ava at the stall, Sal at the workshop, and Jonas on the wall. Then read the quest board."
giver = "elder_marek"
objectives = [
  { key = "met_ava", description = "Talk to Ava", count = 1 },
  { key = "met_sal", description = "Talk to Sal", count = 1 },
  { key = "met_jonas", description = "Talk to Jonas", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 25 },
]

[[quest]]
id = "first_errand"
title = "First Errand"
description = "Gather five handfuls of medicinal herbs from the west meadow for Marek."
giver = "elder_marek"
prereq = "settling_in"
objectives = [
  { key = "herbs", description = "Gather medicinal herbs", count = 5 },
]
rewards = [
  { item = "base:old_coin", count = 50 },
  { item = "base:iron_pickaxe", count = 1 },
]

[[quest]]
id = "the_spark"
title = "The Spark"
description = "Sal left smelter materials by the workshop. Place the smelter, feed it, and bring him an iron ingot."
giver = "tinkerer_sal"
objectives = [
  { key = "ingot", description = "Smelt an iron ingot", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 50 },
  { item = "belt_quest:health_stim", count = 2 },
]

[[quest]]
id = "first_threat"
title = "First Threat"
description = "Jonas lent you an iron blade. Take three wolves in the west meadow."
giver = "guard_jonas"
objectives = [
  { key = "wolves", description = "Kill wolves", count = 3 },
]
rewards = [
  { item = "base:old_coin", count = 75 },
  { item = "belt_quest:light_melee_frame", count = 1 },
]

# The Foreman's conduit lock: solved valves complete this hidden quest;
# its rewards open the sealed corridor and teach the Scrap Rig.

[[quest]]
id = "mines_conduits"
title = "The Foreman's Lock"
description = "Route the dead conduits of the Abandoned Mines."
objectives = [
  { key = "routed", description = "Find the powered valve order", count = 1 },
]
rewards = [
  { set_flag = "mines_conduits", flag_value = "true" },
]

# ---- C8: first contact ----

[[quest]]
id = "strange_signals"
title = "Strange Signals"
description = "Sal swears the hill hums on a schedule now. Take her readings up there and see what hums back."
giver = "tinkerer_sal"
prereq = "the_spark"
objectives = [
  { key = "readings", description = "Record the hill-top signal", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 100 },
]

[[quest]]
id = "into_the_deep"
title = "Into the Deep"
description = "The ruins west of Haven opened overnight. Sal wants one of their components; Jonas wants to know what else is in there."
giver = "tinkerer_sal"
prereq = "strange_signals"
objectives = [
  { key = "component", description = "Recover an alien component", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 150 },
]
