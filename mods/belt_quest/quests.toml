# Haven's first arc (belts 07 + 13): settle in, errand, factory spark,
# first blood. Rewards follow the authored credits/XP where the engine
# has a channel (items, XP via skill sources, KV flags); credit amounts
# land as old_coins until C7's economy lands.

[[quest]]
id = "settling_in"
title = "Settling In"
description = "Meet Ava at the stall, Sal at the workshop, and Jonas on the wall. Then read the quest board."
giver = "elder_marek"
objectives = [
  { key = "met_ava", description = "Talk to Ava", count = 1 },
  { key = "met_sal", description = "Talk to Sal", count = 1 },
  { key = "met_jonas", description = "Talk to Jonas", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 25 },
  { add_reputation = "haven", rep_amount = 10 },
]

[[quest]]
id = "first_errand"
title = "First Errand"
description = "Gather five handfuls of medicinal herbs from the west meadow for Marek."
giver = "elder_marek"
prereq = "settling_in"
objectives = [
  { key = "herbs", description = "Gather medicinal herbs", count = 5 },
]
rewards = [
  { item = "base:old_coin", count = 50 },
  { item = "base:iron_pickaxe", count = 1 },
  { add_reputation = "haven", rep_amount = 15 },
]

[[quest]]
id = "the_spark"
title = "The Spark"
description = "Sal left smelter materials by the workshop. Place the smelter, feed it, and bring him an iron ingot."
giver = "tinkerer_sal"
objectives = [
  { key = "ingot", description = "Smelt an iron ingot", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 50 },
  { item = "belt_quest:health_stim", count = 2 },
  { add_reputation = "haven", rep_amount = 15 },
]

[[quest]]
id = "first_threat"
title = "First Threat"
description = "Jonas lent you an iron blade. Take three wolves in the west meadow."
giver = "guard_jonas"
objectives = [
  { key = "wolves", description = "Kill wolves", count = 3 },
]
rewards = [
  { item = "base:old_coin", count = 75 },
  { item = "belt_quest:light_melee_frame", count = 1 },
  { add_reputation = "haven", rep_amount = 25 },
]

# The Foreman's conduit lock: solved valves complete this hidden quest;
# its rewards open the sealed corridor and teach the Scrap Rig.

[[quest]]
id = "mines_conduits"
title = "The Foreman's Lock"
description = "Route the dead conduits of the Abandoned Mines."
objectives = [
  { key = "routed", description = "Find the powered valve order", count = 1 },
]
rewards = [
  { set_flag = "mines_conduits", flag_value = "true" },
]

# ---- C8: first contact ----

[[quest]]
id = "strange_signals"
title = "Strange Signals"
description = "Sal swears the hill hums on a schedule now. Take her readings up there and see what hums back."
giver = "tinkerer_sal"
prereq = "the_spark"
objectives = [
  { key = "readings", description = "Record the hill-top signal", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 100 },
]

[[quest]]
id = "into_the_deep"
title = "Into the Deep"
description = "The ruins west of Haven opened overnight. Sal wants one of their components; Jonas wants to know what else is in there."
giver = "tinkerer_sal"
prereq = "strange_signals"
objectives = [
  { key = "component", description = "Recover an alien component", count = 1 },
]
rewards = [
  { item = "base:old_coin", count = 150 },
]

# ---- C7: settlement orders (production contracts) ----
# Progressed by crafting (on_craft hook in main.rhai); paid in credits
# and standing by the ordering settlement.

[[quest]]
id = "order_haven_plates"
title = "Order: Iron Plates for Haven"
description = "Haven's wall crew is behind schedule. Produce 8 iron plates at any assembler."
giver = "elder_marek"
objectives = [
  { key = "plates", description = "Produce iron plates", count = 8 },
]
rewards = [
  { item = "base:old_coin", count = 120 },
  { add_reputation = "haven", rep_amount = 20 },
]

[[quest]]
id = "order_emberwatch_frames"
title = "Order: Frames for Emberwatch"
description = "Bryn's crew is rigging a second adit and needs machine frames. Assemble 2 at any assembler."
giver = "warden_bryn"
objectives = [
  { key = "frames", description = "Assemble machine frames", count = 2 },
]
rewards = [
  { item = "base:old_coin", count = 100 },
  { add_reputation = "emberwatch", rep_amount = 25 },
]

[[quest]]
id = "order_saltmarsh_wire"
title = "Order: Wire for Saltmarsh"
description = "Oda is rewiring her post by lamplight. Draw 10 copper wire at the assembler and she'll owe you."
giver = "trader_oda"
objectives = [
  { key = "wire", description = "Draw copper wire", count = 10 },
]
rewards = [
  { item = "base:old_coin", count = 90 },
  { add_reputation = "saltmarsh_post", rep_amount = 25 },
]

# ---- C8 wave two: relationship thresholds ----
# Completed by main.rhai when the custodian_rep channel crosses each
# threshold; rewards are the path-locked technologies.

[[quest]]
id = "custodian_alliance"
title = "Provisional Partners"
description = "The Custodian's assessment has crossed cooperative threshold. Its fabrication templates unlock."
objectives = [
  { key = "assessed", description = "Earn Cooperative standing", count = 1 },
]
rewards = [
  { learn_recipe = "belt_quest:custodian_beacon" },
]

[[quest]]
id = "custodian_enmity"
title = "Archived Hostility"
description = "The Custodian's assessment has crossed hostile threshold. Salvage protocols unlock."
objectives = [
  { key = "assessed", description = "Earn Hostile standing", count = 1 },
]
rewards = [
  { learn_recipe = "belt_quest:salvaged_beam_emitter" },
  { learn_recipe = "belt_quest:reactive_plating" },
]

# ---- C8 wave three: transcendence staging ----

[[quest]]
id = "resonance_chamber"
title = "Resonance Chamber"
description = "The Custodian's fabrication templates include a chamber that resonates with something deep below. Build it."
giver = "tinkerer_sal"
prereq = "into_the_deep"
objectives = [
  { key = "alloy", description = "Deliver alien alloy to the depot", count = 6 },
]
rewards = [
  { item = "archive_data", count = 1 },
  { add_reputation = "haven", rep_amount = 50 },
]

[[quest]]
id = "the_archive_open"
title = "The Archive Opens"
description = "The Warden guards the deepest stacks. Its defeat opens the Archive."
objectives = [
  { key = "warden", description = "Defeat the Archive Warden", count = 1 },
]
rewards = [
  { item = "alien_component", count = 3 },
  { set_flag = "archive_opened", flag_value = "true" },
]
